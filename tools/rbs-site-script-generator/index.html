<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBS Site Script Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: top status bar, dark step rail on the left, one workspace panel per step; rail turns into a scrolling step strip on phones */
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fb; --ink: #142031; --muted: #5b6678; --line: #d8dee8;
  --rail: #111a27; --rail-ink: #e7ecf3; --rail-muted: #8c99ab; --rail-line: #223044;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e5edfd;
  --ok: #13804a; --ok-soft: #e1f3e8; --warn: #a15c00; --warn-soft: #fcf0d9; --crit: #c0261a; --crit-soft: #fde6e3;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c121b; --panel: #141c28; --panel-2: #101722; --ink: #e6ebf2; --muted: #98a4b6; --line: #273344;
    --rail: #090e16; --rail-ink: #e6ebf2; --rail-muted: #7f8ca0; --rail-line: #1d2838;
    --accent: #6f98ff; --accent-ink: #0a1120; --accent-soft: #19253d;
    --ok: #4cc27f; --ok-soft: #11281b; --warn: #f0ae4a; --warn-soft: #2d2211; --crit: #ff7b6f; --crit-soft: #321715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c121b; --panel: #141c28; --panel-2: #101722; --ink: #e6ebf2; --muted: #98a4b6; --line: #273344;
  --rail: #090e16; --rail-ink: #e6ebf2; --rail-muted: #7f8ca0; --rail-line: #1d2838;
  --accent: #6f98ff; --accent-ink: #0a1120; --accent-soft: #19253d;
  --ok: #4cc27f; --ok-soft: #11281b; --warn: #f0ae4a; --warn-soft: #2d2211; --crit: #ff7b6f; --crit-soft: #321715;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100%; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--rail); color: var(--rail-ink); border-bottom: 1px solid var(--rail-line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 16px; height: 16px; }
.topbar .spacer { flex: 1; }
.chipline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tchip { font: 500 12px/1 var(--font-mono); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--rail-line); color: var(--rail-muted); white-space: nowrap; }
.tchip b { color: var(--rail-ink); font-weight: 600; }
.pill { font: 600 12px/1 var(--font-body); padding: 6px 10px; border-radius: 99px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }

.rail { background: var(--rail); color: var(--rail-ink); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid var(--rail-line); }
.rail h2 { font: 600 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--rail-muted); margin: 0 6px 4px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: st; }
.stepbtn { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 8px; border: 0; border-radius: 8px; background: none; color: var(--rail-ink); cursor: pointer; text-align: left; }
.stepbtn:hover { background: rgba(255,255,255,.05); }
.stepbtn[aria-current="step"] { background: rgba(111,152,255,.16); }
.stepnum { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--font-mono); border: 1.5px solid var(--rail-muted); color: var(--rail-muted); }
.stepbtn[aria-current="step"] .stepnum { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.stepbtn.done .stepnum { border-color: var(--ok); color: var(--ok); }
.stepbtn.done[aria-current="step"] .stepnum, .stepbtn[aria-current="step"] .stepnum { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.steptxt { display: grid; min-width: 0; }
.steptxt b { font-weight: 500; font-size: 14px; }
.steptxt small { color: var(--rail-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font: 600 11px/1 var(--font-mono); padding: 4px 6px; border-radius: 5px; }
.badge.e { background: var(--crit); color: #fff; }
.badge.w { background: var(--warn); color: #1c1200; }
.badge.k { color: var(--ok); }
.railtool { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--rail-line); background: none; color: var(--rail-ink); cursor: pointer; width: 100%; text-align: left; }
.railtool:hover, .railtool[aria-current="page"] { border-color: var(--accent); }
.railtool svg { width: 17px; height: 17px; color: var(--rail-muted); flex: none; }
.railnote { font-size: 12px; color: var(--rail-muted); margin: auto 6px 0; line-height: 1.45; }

.work { padding: 22px 26px 40px; min-width: 0; }
.stephead { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; max-width: 1100px; }
.stephead .eyebrow { font: 600 11.5px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.stephead h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 4px; font-weight: 600; text-wrap: balance; }
.stephead p { margin: 0; color: var(--muted); max-width: 72ch; }
.panelgrid { display: grid; gap: 14px; max-width: 1100px; }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel > h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.panel > .hint { margin: 0 0 12px; }
.hint { color: var(--muted); font-size: 13px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px 12px; }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; align-content: start; }
label.f.wide { grid-column: 1 / -1; }
input, select, textarea { font: 13.5px/1.3 var(--font-mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px; width: 100%; min-width: 0; }
input[aria-invalid="true"] { border-color: var(--crit); background: var(--crit-soft); }
textarea { resize: vertical; min-height: 70px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); padding-top: 4px; }
label.chk input { width: auto; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px; white-space: nowrap; font-size: 12px; border-bottom: 1px solid var(--line); }
td { padding: 4px; vertical-align: middle; }
td input, td select { padding: 6px 7px; font-size: 13px; }
.n-col { width: 82px; } .p-col { width: 66px; } .ip-col { min-width: 130px; } .x-col { width: 38px; }
.rtable td { padding: 7px 8px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 12.5px; }
.rtable td:first-child { font-family: var(--font-body); font-weight: 500; }
.rtable tr:last-child td { border-bottom: 0; }

.btn { font-size: 14px; font-weight: 500; border-radius: 7px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: inline-flex; gap: 7px; align-items: center; justify-content: center; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { font-size: 13px; padding: 6px 10px; }
.btn.icon { padding: 5px 9px; color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
input[type=file] { display: none; }

.choice { display: grid; gap: 10px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); text-align: left; cursor: pointer; color: var(--ink); }
.choice:hover, .choice.over { border-color: var(--accent); }
.choice .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.choice .ic svg { width: 19px; height: 19px; }
.choice b { font-size: 15px; font-weight: 600; }
.choice span { color: var(--muted); font-size: 13px; }
.choice.recommended { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tag { font: 600 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.examples { display: flex; gap: 8px; flex-wrap: wrap; }

.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issues li { font-size: 13px; padding: 7px 10px; border-left: 3px solid; border-radius: 0 6px 6px 0; }
.issues li.e { border-color: var(--crit); background: var(--crit-soft); }
.issues li.w { border-color: var(--warn); background: var(--warn-soft); }
.issues li.i { border-color: var(--ok); background: var(--ok-soft); }
.issues .where { font-weight: 600; margin-right: 5px; }
.issues button.go { margin-left: 6px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; text-decoration: underline; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi b { display: block; font: 600 22px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi.e b { color: var(--crit); } .kpi.w b { color: var(--warn); } .kpi.k b { color: var(--ok); }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; max-width: 1100px; }
.files { font: 13px/1.7 var(--font-mono); word-break: break-all; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
pre { margin: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; font: 12px/1.45 var(--font-mono); overflow: auto; max-height: 420px; white-space: pre; tab-size: 2; }
.ptabs { display: flex; gap: 6px; margin-bottom: 8px; }
.ptabs .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.toast { min-height: 20px; font-size: 13px; color: var(--ok); }
.toast.bad { color: var(--crit); }
.lock { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 10px; }
.lock.ok { background: var(--ok-soft); color: var(--ok); }
.lock.crit { background: var(--crit-soft); color: var(--crit); }
.lock svg { width: 22px; height: 22px; flex: none; }
.lock b { display: block; font-size: 15px; }
.lock span { color: var(--ink); font-size: 13px; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 16px; text-align: center; background: var(--panel); display: grid; gap: 10px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.kv { color: var(--muted); font-size: 13px; }
.kv b { color: var(--ink); font-weight: 500; font-family: var(--font-mono); }
.rules { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.full-only[hidden] { display: none; }
[hidden] { display: none !important; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { flex-direction: row; overflow-x: auto; padding: 8px 10px; gap: 8px; border-right: 0; border-bottom: 1px solid var(--rail-line); }
  .rail h2, .railnote { display: none; }
  .steps { display: flex; gap: 4px; }
  .steps li { flex: none; }
  .stepbtn { display: flex; gap: 7px; white-space: nowrap; padding: 7px 9px; }
  .stepnum { width: 24px; height: 24px; font-size: 12px; }
  .steptxt small { display: none; }
  .railtool { width: auto; white-space: nowrap; }
  .work { padding: 16px 16px 32px; }
  .cols-2, .cols-3 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M7.5 7.5l2 2M16.5 7.5l-2 2M12 11l-5 10h10z"/></svg></span>RBS Site Script Generator</div>
    <div class="spacer"></div>
    <div class="chipline">
      <span class="tchip">Node <b id="tc-node">—</b></span>
      <span class="tchip">Style <b id="tc-style">—</b></span>
      <span class="tchip">Radios <b id="tc-radios">0</b></span>
      <span id="tc-status" class="pill ok">Ready</span>
    </div>
  </header>

  <nav class="rail" aria-label="Workflow">
    <h2>Workflow</h2>
    <ol class="steps" id="steps"></ol>
    <h2>Tools</h2>
    <button class="railtool" id="nav-check" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Check a script file</button>
    <p class="railnote">Runs in your browser. Nothing is uploaded. Your draft is kept on this device.</p>
  </nav>

  <main class="work" id="work"></main>
</div>

<script>
/* RBS Site Script Generator core — pure functions, no DOM.
   generateSiteBasic(cfg) / generateSiteEquipment(cfg) / validateConfig(cfg) / lintXml(text) */
var Core = (function () {
  'use strict';
  var NC = 'urn:ietf:params:xml:ns:netconf:base:1.0';
  var NS = {
    top: 'urn:com:ericsson:ecim:ComTop', lm: 'urn:com:ericsson:ecim:RcsLM', secm: 'urn:com:ericsson:ecim:RcsSecM',
    certm: 'urn:com:ericsson:ecim:RcsCertM', ldap: 'urn:com:ericsson:ecim:RcsLdapAuthentication', user: 'urn:com:ericsson:ecim:RcsUser',
    sysm: 'urn:com:ericsson:ecim:RcsSysM', snmp: 'urn:com:ericsson:ecim:RcsSnmp', timem: 'urn:com:ericsson:ecim:RcsTimeM',
    router: 'urn:com:ericsson:ecim:RtnL3Router', if4: 'urn:com:ericsson:ecim:RtnL3InterfaceIPv4', eth: 'urn:com:ericsson:ecim:RtnL2EthernetPort',
    vlan: 'urn:com:ericsson:ecim:RtnL2VlanPort', route: 'urn:com:ericsson:ecim:RtnRoutesStaticRouteIPv4', dns: 'urn:com:ericsson:ecim:RtnDnsClient',
    rsntp: 'urn:com:ericsson:ecim:RsyncNtp', eq: 'urn:com:ericsson:ecim:ReqEquipment', fru: 'urn:com:ericsson:ecim:ReqFieldReplaceableUnit',
    tnport: 'urn:com:ericsson:ecim:ReqTnPort', ant: 'urn:com:ericsson:ecim:ReqAntennaSystem', rfport: 'urn:com:ericsson:ecim:ReqRfPort',
    riport: 'urn:com:ericsson:ecim:ReqRiPort', sync: 'urn:com:ericsson:ecim:ReqSyncPort', trx: 'urn:com:ericsson:ecim:ReqTransceiver',
    aas: 'urn:com:ericsson:ecim:ReqAasData', rilink: 'urn:com:ericsson:ecim:ReqRiLink', sup: 'urn:com:ericsson:ecim:RmeSupport',
    mpc: 'urn:com:ericsson:ecim:RmeMpClusterHandling', sef: 'urn:com:ericsson:ecim:RmeSectorEquipmentFunction'
  };
  var BB_RI_PORTS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R','S','T'];
  var ID_RE = /^[A-Za-z0-9_-]+$/;

  /* ---------- tiny XML tree builder ---------- */
  function E(name, ns) { var kids = []; for (var i = 2; i < arguments.length; i++) push(kids, arguments[i]); return { n: name, ns: ns, k: kids }; }
  function push(arr, x) { if (x == null || x === false) return; if (Array.isArray(x)) x.forEach(function (y) { push(arr, y); }); else arr.push(x); }
  function L(name, v) { return { n: name, v: String(v) }; }
  function X(name) { return { n: name, empty: true }; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function render(node, d, out) {
    var ind = new Array(d + 1).join('  ');
    if (node.empty) { out.push(ind + '<' + node.n + ' />'); return; }
    if (node.v !== undefined) { out.push(ind + '<' + node.n + '>' + esc(node.v) + '</' + node.n + '>'); return; }
    out.push(ind + '<' + node.n + (node.ns ? ' xmlns="' + node.ns + '"' : '') + '>');
    node.k.forEach(function (c) { render(c, d + 1, out); });
    out.push(ind + '</' + node.n + '>');
  }
  var HELLO = ['<?xml version="1.0" encoding="UTF-8"?>', '<hello xmlns="' + NC + '">', '  <capabilities>',
    '    <capability>urn:ietf:params:netconf:base:1.0</capability>', '  </capabilities>', '</hello>', ']]>]]>'];
  var CLOSE = ['<rpc message-id="Closing" xmlns="' + NC + '">', '  <close-session></close-session>', '</rpc>', ']]>]]>'];
  function editConfig(id, me) {
    var out = HELLO.slice();
    out.push('<rpc message-id="' + id + '" xmlns="' + NC + '">', '  <edit-config>', '    <target>', '      <running />', '    </target>',
      '    <config xmlns:xc="' + NC + '">');
    render(me, 3, out);
    out.push('    </config>', '  </edit-config>', '</rpc>', ']]>]]>');
    return out.concat(CLOSE);
  }
  function finish(lines) { return lines.join('\r\n') + '\r\n'; }
  function ME() { var a = [L('managedElementId', 1)]; for (var i = 0; i < arguments.length; i++) push(a, arguments[i]); return E('ManagedElement', NS.top, a); }

  /* ---------- SiteBasic ---------- */
  function generateSiteBasic(c) {
    var full = c.style === 'full';
    var lines = [];
    var tnRef = 'ManagedElement=1,Equipment=1,FieldReplaceableUnit=' + c.tn.fru + ',TnPort=' + c.tn.port;
    var ethRef = 'ManagedElement=1,Transport=1,EthernetPort=' + c.tn.port;
    var f1 = c.f1 && c.f1.enabled;

    // rpc 1
    lines = lines.concat(editConfig(1, ME(
      L('dnPrefix', 'SubNetwork=' + c.rootMo + ',SubNetwork=' + c.subNetwork + ',MeContext=' + c.nodeName),
      E('SystemFunctions', null, L('systemFunctionsId', 1), E('Lm', NS.lm, L('lmId', 1), L('fingerprint', c.nodeName))))));
    // rpc 2
    lines = lines.concat(HELLO, ['<rpc message-id="2" xmlns="' + NC + '">', '  <action xmlns="urn:com:ericsson:ecim:1.0">', '    <data>',
      '      <ManagedElement>', '        <managedElementId>1</managedElementId>', '        <SystemFunctions>', '          <systemFunctionsId>1</systemFunctionsId>',
      '          <Lm>', '            <lmId>1</lmId>', '            <IntegrationUnlock>', '              <integrationUnlockId>1</integrationUnlockId>',
      '              <activate />', '            </IntegrationUnlock>', '          </Lm>', '        </SystemFunctions>', '      </ManagedElement>',
      '    </data>', '  </action>', '</rpc>', ']]>]]>'], CLOSE);

    // rpc 3 helpers
    var routerAttrs = full ? [L('hopLimit', 64), L('pathMtuExpiresIPv6', 86400), L('ttl', 64)] : [];
    function routerDecl(id) { return E('Router', NS.router, L('routerId', id), routerAttrs); }
    var ifAttrsPre = full ? [L('arpTimeout', 300), L('bfdStaticRoutes', 'DISABLED')] : [];
    var ifAttrsPost = full ? [L('mtu', 1500), L('pcpArp', 6)] : [];
    function vlanPort(name, vlan) {
      return E('VlanPort', NS.vlan, L('vlanPortId', name), L('encapsulation', ethRef), full ? L('isTagged', 'true') : null, L('vlanId', vlan));
    }
    function addr(ip, prefix) {
      return E('AddressIPv4', null, L('addressIPv4Id', 1), L('address', ip + '/' + prefix),

    var p = $('step-issues');
    if (p) {
      var L = S.last, e = L.errors.filter(function (x) { return stepOf(x.where) === S.step; }),
        w = L.warnings.filter(function (x) { return stepOf(x.where) === S.step; }).map(function (x) { return { where: x.where, msg: x.msg, kind: 'w' }; });
      p.hidden = !(e.length || w.length);
      p.innerHTML = '<h2>Fix on this step</h2>' + issueList(e.concat(w), false);
    }
  }
  function markInvalid() {
    // highlight inputs whose value is named in an error message
    var msgs = S.last.errors.map(function (x) { return x.where + ' ' + x.msg; }).join('\n');
    document.querySelectorAll('#work input[data-path]').forEach(function (el) {
      var v = el.value.trim(), path = el.dataset.path, bad = false;
      if (!v && /(nodeName|\.vlan$|\.ip$|\.gw$|\.prefix$|snmp\.target|\.sector$|\.fru$|\.router$|\.vlanPort$)/.test(path)) bad = /is empty|not a valid|must be/.test(msgs) && S.visited[S.step];
      else if (v && v.length > 1 && msgs.indexOf('"' + v + '"') >= 0) bad = true;
      else if (v && /^\d{3,4}$/.test(v) && /\.vlan$/.test(path) && msgs.indexOf('VLAN ' + v + ' is already') >= 0) bad = true;
      else if (v && /\.(ip|gw)$/.test(path) && new RegExp('(Gateway|IP) ' + v.replace(/\./g, '\\.') + ' ').test(msgs)) bad = true;
      el.setAttribute('aria-invalid', bad ? 'true' : 'false');
    });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ cfg: S.cfg, label: S.label, step: S.step, visited: S.visited })); } catch (e) {} }
  function go(step) { S.view = 'flow'; S.step = step; S.visited[step] = true; try { history.replaceState(null, '', '#' + step); } catch (e) {} render(); }
  function load(c, label, step) { S.cfg = clone(c); S.label = label; S.visited = {}; go(step || 'site'); }

  /* ---------- events ---------- */
  function nextFree(list, prefix) { var n = 1; while (list.indexOf(prefix + n) >= 0) n++; return prefix + n; }
  function freeRi() { var used = S.cfg.radios.map(function (r) { return r.riPort; }); return Core.BB_RI_PORTS.filter(function (p) { return used.indexOf(p) < 0; })[0] || 'A'; }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.goto) { go(b.dataset.goto); return; }
    if (b.id === 'nav-check') { S.view = 'check'; try { history.replaceState(null, '', '#check'); } catch (x) {} render(); return; }
    if (b.dataset.example !== undefined) { var k = EXK[+b.dataset.example]; load(EXAMPLES[k], k + ' example'); return; }
    if (b.id === 'start-blank') { load(blankConfig(), 'new site from scratch'); return; }
    if (b.dataset.del) { S.cfg[b.dataset.del].splice(+b.dataset.i, 1); render(true); return; }
    if (b.id === 'add-traffic') { S.cfg.traffic.push({ router: '', vlanPort: '', vlan: '', ip: '', prefix: 27, gw: '' }); render(true); return; }
    if (b.id === 'add-rru' || b.id === 'add-air') {
      var secs = S.cfg.radios.map(function (r) { return r.sector; }), frus = S.cfg.radios.map(function (r) { return r.fru; }), s = nextFree(secs, 'S');
      if (b.id === 'add-rru') S.cfg.radios.push({ type: 'RRU', sector: s, fru: 'RRU-' + s, branches: 4, riPort: freeRi() });
      else S.cfg.radios.push({ type: 'AIR', sector: s, fru: nextFree(frus, 'AIR-'), branches: '', riPort: freeRi() });
      render(true); return;
    }
    if (b.id === 'dl') { download(); return; }
    if (b.id === 'cp-sb' && S.last.ok) { copy(S.last.sb, 'Site Basic'); return; }
    if (b.id === 'cp-eq' && S.last.ok) { copy(S.last.eq, 'Site Equipment'); return; }
    if (b.id === 'cp-mos') { copy($('moshell').textContent, 'MoShell commands'); return; }
    if (b.id === 'pv-sb' || b.id === 'pv-eq') { S.preview = b.id === 'pv-sb' ? 'sb' : 'eq'; render(true); }
  });
  function onField(e) {
    var el = e.target, path = el.dataset && el.dataset.path; if (!path) return;
    var v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.kind === 'list') v = el.value.split(/[\s,;]+/).filter(Boolean);
    set(path, v);
    var rebuild = path === 'style' || path === 'security.certm' || /\.type$/.test(path);
    if (/\.type$/.test(path)) { var r = get(path.replace(/\.type$/, '')); if (v === 'RRU' && !r.branches) r.branches = 4; if (v === 'AIR') r.branches = ''; }
    if (rebuild) render(true); else softRefresh();
  }
  document.addEventListener('input', function (e) { if (e.target.tagName !== 'SELECT' && e.target.type !== 'checkbox' && e.target.type !== 'file') onField(e); });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'imp-file') { readFiles(e.target.files, importFiles); e.target.value = ''; return; }
    if (e.target.id === 'chk-file') { readFiles(e.target.files, check); e.target.value = ''; return; }
    if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') onField(e);
  });
  ['dragover', 'dragleave', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      var z = e.target.closest && e.target.closest('#drop, #imp-drop'); if (!z) return;
      e.preventDefault();
      if (ev === 'dragover') z.classList.add('over');
      else { z.classList.remove('over'); if (ev === 'drop') readFiles(e.dataTransfer.files, z.id === 'drop' ? check : importFiles); }
    });
  });

  function readFiles(fileList, cb) {
    var files = Array.prototype.slice.call(fileList || []), out = [], n = files.length;
    if (!n) return;
    files.forEach(function (f, i) { var r = new FileReader(); r.onload = function () { out[i] = { name: f.name, text: String(r.result) }; if (--n === 0) cb(out); }; r.readAsText(f); });
  }
  function importFiles(fs) {
    var r = Core.importFiles(fs.map(function (f) { return f.text; }), S.cfg || blankConfig());
    load(r.cfg, 'imported from ' + fs.map(function (f) { return f.name; }).join(', '), 'review');
  }
  function check(fs) {
    $('results').innerHTML = fs.map(function (f) {
      var r = Core.lintXml(f.text, f.name), cls = r.errors.length ? 'crit' : (r.warnings.length ? 'warn' : 'ok');
      var label = r.errors.length ? r.errors.length + ' error' + (r.errors.length > 1 ? 's' : '') : (r.warnings.length ? 'Loads, with warnings' : 'No problems found');
      var li = r.errors.map(function (x) { return '<li class="e"><span class="where">' + (x.line ? 'Line ' + x.line : 'File') + ':</span>' + escH(x.msg) + '</li>'; })
        .concat(r.warnings.map(function (x) { return '<li class="w"><span class="where">' + (x.line ? 'Line ' + x.line : 'File') + ':</span>' + escH(x.msg) + '</li>'; }));
      return '<div class="panel"><h2><span class="pill ' + cls + '">' + label + '</span><span class="files">' + escH(f.name) + '</span></h2>' +
        '<div class="kv" style="margin:6px 0 10px">Type <b>' + escH(r.info.kind) + '</b> · Node <b>' + escH(r.info.node || '?') + '</b> · MOs <b>' + r.info.moCount + '</b></div>' +
        (li.length ? '<ul class="issues">' + li.join('') + '</ul>' : '') + '</div>';
    }).join('');
  }
  function toast(msg, bad) { var t = $('toast'); if (!t) return; t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { t.textContent = ''; }, 5000); }
  function copy(text, what) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
      toast(ok ? what + ' copied' : 'Copy was blocked. Select the text in Preview and copy it.', !ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(what + ' copied'); }, fallback);
    else fallback();
  }
  function download() {
    if (!S.last.ok) return;
    var names = Core.fileNames(S.last.c);
    var zip = Core.makeZip([{ name: names.basic, data: S.last.sb }, { name: names.equip, data: S.last.eq }]);
    var zname = S.last.c.nodeName + '_site_scripts.zip', blob = new Blob([zip], { type: 'application/zip' });
    if (downloadsNs) {
      downloadsNs.save({ filename: zname, data: blob }).then(function () { toast('Saved ' + zname); }, function (e) {
        toast(e && e.code === 'declined' ? 'Download cancelled' : 'Download not available here. Use the Copy buttons.', true);
      });
      return;
    }
    try {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = zname; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Saving ' + zname + '. If nothing downloads, use the Copy buttons.');
    } catch (e) { toast('Download not available here. Use the Copy buttons.', true); }
  }

  /* ---------- start ---------- */
  var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (saved && saved.cfg && saved.cfg.radios) { S.cfg = saved.cfg; S.label = saved.label || 'your last draft'; S.visited = saved.visited || {}; }
  else { S.cfg = clone(EXAMPLES[EXK[0]]); S.label = EXK[0] + ' example'; }
  var h = (location.hash || '').slice(1);
  if (h === 'check') { S.view = 'check'; render(); }
  else go(STEPS.some(function (s) { return s.id === h; }) ? h : 'start');
  window.addEventListener('hashchange', function () { var x = location.hash.slice(1); if (x === 'check') { S.view = 'check'; render(); } else if (STEPS.some(function (s) { return s.id === x; }) && (x !== S.step || S.view !== 'flow')) go(x); });
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(function (ns) { downloadsNs = ns; }, function () {});
})();
</script>
</body>
